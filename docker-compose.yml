version: '3.9'

# Секреты берутся из файла .env рядом с этим файлом (шаблон: .env.example).
services:

    postgresdb:
        image: postgres:latest
        ports:
            - 5555:5432
        restart: on-failure
        volumes:
            - ./postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_USER: postgres
            POSTGRES_DB: QuestsSharp
            PGDATA: "/var/lib/postgresql/data/pgdata"

    auth-service:
        build:
            context: ./
            dockerfile: ./server/AuthService/Dockerfile
        ports:
            - 9004:80
        restart: on-failure
        environment:
            ConnectionStrings__DefaultConnection: Host=postgresdb;Port=5432;Database=QuestsSharp;Username=postgres;Password=${POSTGRES_PASSWORD}
            Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
            Secret__PasswordHash: ${PASSWORD_HASH_SECRET:?set PASSWORD_HASH_SECRET in .env}
        depends_on:
            - postgresdb

    generate-quest-service:
        build:
            context: ./
            dockerfile: ./server/GenerateQuestsService/Dockerfile
        ports:
            - 9005:80
        restart: on-failure
        environment:
            ConnectionStrings__DefaultConnection: Host=postgresdb;Port=5432;Database=QuestsSharp;Username=postgres;Password=${POSTGRES_PASSWORD}
        depends_on:
            - postgresdb

    quest-core:
        build:
            context: ./
            dockerfile: ./server/QuestCore/Dockerfile
        ports:
            - 9003:80
        restart: on-failure
        environment:
            ConnectionStrings__DefaultConnection: Host=postgresdb;Port=5432;Database=QuestsSharp;Username=postgres;Password=${POSTGRES_PASSWORD}
            Jwt__Key: ${JWT_KEY}
        depends_on:
            - postgresdb

volumes:
    postgresdb:
